[project]
name = "dtdecoder"
version = "0.6.0"
description = "Decodificador tactico de entrenadores via cadenas de Markov absorbentes sobre eventos StatsBomb"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "marimo>=0.9"]

[project.scripts]
dtdecoder = "dtdecoder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtdecoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Preservacion estricta de codigo (AGENTS.md): no modificar src/ ni tests/.
# Se ignoran de forma explicita las reglas no criticas de estilo/conveniencia:
# - RUF059: variables sin usar en desempaquetados de tuplas en helpers de test (_setup)
# - I001: ordenamiento de bloques de import
# - BLE001: except Exception generico en resolucion defensiva de version/commit
# - RUF100: comentarios noqa innecesarios
# - PLW1510: subprocess.run sin check explicito en fallback de git commit
# - RUF046: cast redundante int(round(...))
# - SIM113: incremento de contador en bucle synth
ignore = [
    "RUF059",
    "I001",
    "BLE001",
    "RUF100",
    "PLW1510",
    "RUF046",
    "SIM113",
]
