# Tema base oscuro. El CSS de app.py refina encima, pero Streamlit necesita
# esto para que sus propios widgets nazcan oscuros en vez de pelearse con el CSS.
[theme]
base = "dark"
primaryColor = "#0a84ff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#101018"
textColor = "#f5f5f7"

[server]
headless = true
[browser]
gatherUsageStats = false
