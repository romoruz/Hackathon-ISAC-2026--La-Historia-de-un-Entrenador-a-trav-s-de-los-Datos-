# ---------------------------------------------------------------------------
# Configuracion por defecto. Todo parametro que afecte resultados vive AQUI,
# nunca hardcodeado en el codigo. Esto es lo que haces citable en el reporte.
# ---------------------------------------------------------------------------

pitch:
  length: 120.0        # coordenadas StatsBomb
  width: 80.0
  nx: 5                # columnas de la malla (eje de ataque)
  ny: 4                # filas de la malla (eje lateral)

possession:
  moving_types: ["Pass", "Carry", "Shot"]
  pass_loss_outcomes: ["Incomplete", "Out", "Pass Offside", "Unknown", "Injury Clearance"]
  min_actions: 2
  # Acarreos por debajo de este umbral (metros) se descartan.
  # StatsBomb registra `Carry` con mucha generosidad: pase-acarreo-pase-acarreo.
  # Los acarreos cortos son reajustes de control, no decisiones tacticas, y
  # llenan la cadena de auto-transiciones (i -> i) que inflan N artificialmente.
  # 0 = no filtrar.
  # Perspectiva DEFENSIVA (cadena conjugada): min_actions = 1.
  #
  # Con min_actions = 2 se descarta toda posesion de UNA accion que termina en
  # absorcion (remate, pase perdido), porque no recibe absorcion terminal y se
  # queda con una sola fila. En la cadena ofensiva eso ya se conocia y esta
  # contabilizado en 03_METHODS §7.1. En la conjugada es peor: una posesion
  # rival de una accion es JUSTO el producto de una presion exitosa.
  #
  # Medido el 2026-08-24 sobre 18,214 posesiones rivales del America:
  #   descarte global ....  9.06%
  #   vs Solari .......... 10.49%   vs Ortiz ..... 10.41%
  #   vs Herrera ......... 10.24%   vs Jardine ...  8.63%
  # Rango 1.86 pp = 22% relativo, todo concentrado en T = 1. Sesgo diferencial
  # sobre E[T^def] ~ 0.09 acciones: mismo orden que los efectos a detectar.
  # Es el bug #11 en otra forma.
  #
  # CONSECUENCIA A DECLARAR: E[T^att] y E[T^def] quedan truncados a distinto
  # nivel y NO son comparables entre si. Era vs era dentro de la misma
  # perspectiva, si.
  min_actions_defense: 1
  min_carry_length: 5.0
  # StatsBomb normaliza coordenadas al marco de ataque del equipo que ejecuta.
  # Si tu extraccion NO lo hace, pon flip_defensive: true y verificalo con el
  # test de sanidad (ver README, seccion "Verificacion de coordenadas").
  flip_defensive: false

defense:
  # Fuente de la marca de presion. `under_pressure` es una BANDERA: StatsBomb
  # escribe `true` u OMITE la llave, asi que polars la lee como null. Medido:
  # 114,552 true / 0 false / 468,963 null sobre 583,515 eventos. Filtrar por
  # is_not_null() daria pi ~ 1 en todas partes, en silencio. Bug #13 evitado.
  pressure_flag: "under_pressure"
  pressure_null_is_false: true
  # Estimador alternativo para validacion cruzada: contar eventos `Pressure`
  # propios contra acciones rivales. Hay 53,006 en el archivo, contra ~57k
  # marcas under_pressure por lado. Que coincidan es validacion externa gratis;
  # que no coincidan es un hallazgo sobre el registro del proveedor.
  pressure_event_type: "Pressure"
  # Accion defensiva para PPDA (04_DATA_CONTRACT §4). duel_outcome solo esta
  # poblado para Tackle (6,122 eventos, la identidad cierra al evento), y el
  # aereo GANADO no vive en `Duel`: solo aparece "Aerial Lost" (5,474).
  # Se cuentan con independencia del resultado: PPDA mide frecuencia de
  # intervencion, no eficacia.
  defensive_action_types: ["Interception", "Foul Committed"]
  defensive_duel_types: ["Tackle"]
  # Volumen: 6,122 + 3,244 + 4,554 = 13,920 en 175 partidos ~ 40 por equipo y
  # partido. Suficiente para PPDA por TERCIO con bootstrap; insuficiente por
  # zona y era. La resolucion fina es de pi(z), que tiene 114,552 marcas.
  ppda_por: "tercio"
  # Estandarizacion directa por rival. Positividad verificada el 2026-08-24:
  # 17/17 rivales en los seis pares de eras del America, 100% de cobertura.
  standardize_by_opponent: true
  standardize_weights: "uniform"      # uniform | club_schedule
  min_possessions_per_stratum: 20

# Orden CANONICO de las fases. Fija los indices del espacio de estados y por
# tanto el layout de P, N, B y de todo lo que se guarde en disco. NUNCA se
# deriva del orden de las llaves de `phases`: los cargadores de YAML pueden
# reordenarlas y eso desalinearia matrices entre corridas sin avisar.
phase_order: ["open", "transition", "restart", "set_piece"]
phase_default: "open"      # fase para play_patterns no mapeados

phases:
  # play_pattern -> fase tactica (phi). OJO: play_pattern etiqueta la POSESION
  # COMPLETA por como empezo, no el evento individual. Una posesion que arranco
  # con saque de banda queda marcada "From Throw In" en sus 20 acciones
  # siguientes. Por eso `phase` describe EL ORIGEN de la posesion, no si el
  # balon esta parado ahora mismo. Documentalo asi en el reporte.
  open:       ["Regular Play", "From Kick Off"]
  transition: ["From Counter", "From Keeper"]
  restart:    ["From Throw In", "From Goal Kick"]
  set_piece:  ["From Corner", "From Free Kick", "Other"]

context:
  score_bins: [-99, -1, 0, 1, 99]
  score_labels: ["losing", "drawing", "winning"]

estimation:
  lambda_grid: [0.0, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0, 200.0, 500.0,
                1000.0, 2000.0, 5000.0]
  cv_folds: 5
  cv_seed: 20260819

inference:
  n_boot: 2000
  boot_seed: 11235
  fdr_alpha: 0.05
  min_row_count: 15
